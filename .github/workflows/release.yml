name: GitHub and NPM Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v2.2.0). Leave empty to use latest tag'
        required: false
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get tag name
        id: get-tag
        run: |
          # Use input tag if provided, otherwise use the tag from push event
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
            # Add 'v' prefix if not present
            if [[ ! $TAG == v* ]]; then
              TAG="v$TAG"
            fi
          else
            # Use the tag from the push event
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using tag: $TAG"

      - name: Checkout tag
        run: |
          TAG="${{ steps.get-tag.outputs.tag }}"
          git fetch origin tag "$TAG" --depth=1
          git checkout "$TAG"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test and Build
        run: pnpm check

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-assets
          path: |
            dist/axis-twelve.css
            dist/axis-twelve.min.css
            dist/modules/

  release-github:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-assets
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          files: |
            dist/axis-twelve.css
            dist/axis-twelve.min.css
            dist/modules/*.css
          generate_release_notes: true
          make_latest: true

  release-npm:
    needs: build
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - name: Checkout for Metadata
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org/'

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-assets
          path: dist

      - name: Configure npm for automation token
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          echo "registry=https://registry.npmjs.org/" >> .npmrc
          cat .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to NPM
        run: |
          echo "Publishing to NPM..."
          pnpm publish --access public --no-git-checks --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
