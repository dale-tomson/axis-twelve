name: Auto-Tag on Version Change

on:
  push:
    branches:
      - 'ver-2.x'
    paths:
      - 'package.json'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag (e.g., v2.2.0). Leave empty to use current package.json version'
        required: false
        type: string
      force:
        description: 'Force create tag even if it already exists'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      tag_exists: ${{ steps.check-tag.outputs.tag_exists }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from package.json or input
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            if [[ ! $VERSION == v* ]]; then
              VERSION="v$VERSION"
            fi
          else
            VERSION=$(node -p "require('./package.json').version")
            VERSION="v$VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check-tag
        run: |
          TAG=${{ steps.version.outputs.tag }}
          FORCE=${{ github.event.inputs.force || 'false' }}
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
            if [ "$FORCE" == "true" ]; then
              echo "⚠️ Tag $TAG already exists (force mode enabled)"
            else
              echo "ℹ️ Tag $TAG already exists (set force=true to recreate)"
            fi
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
            echo "✅ Tag $TAG does not exist, will create"
          fi

      - name: Create tag if it doesn't exist
        if: steps.check-tag.outputs.tag_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TAG=${{ steps.version.outputs.tag }}
          echo "Creating tag $TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "✅ Tag $TAG created successfully"

      - name: Force update tag
        if: steps.check-tag.outputs.tag_exists == 'true' && github.event.inputs.force == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TAG=${{ steps.version.outputs.tag }}
          echo "Force updating tag $TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -d "$TAG"
          git push origin ":refs/tags/$TAG"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "✅ Tag $TAG force updated"

  trigger-release:
    needs: [check-version]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for tag to propagate
        run: sleep 5
